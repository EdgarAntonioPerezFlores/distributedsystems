global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend presentation
    bind *:80
    http-request set-header X-Presentation-LB presentation-lb-backup
    http-response set-header X-Presentation-LB presentation-backup
    default_backend websites

backend websites
    balance roundrobin
    option httpchk GET /
    server web1 web1:80 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server web2 web2:80 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server web3 web3:80 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
