global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend application
    bind *:8080
    http-request set-header X-Application-LB application-lb-backup
    default_backend application_nodes

backend application_nodes
    balance roundrobin
    option httpchk GET /health
    server app1 app1:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server app2 app2:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server app3 app3:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
