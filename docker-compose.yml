name: distributed-ha-lab
services:
  presentation-lb-master:
    image: haproxy:3.2-alpine
    volumes:
    - ./haproxy/presentation-master.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      web1:
        condition: service_started
      web2:
        condition: service_started
      web3:
        condition: service_started
    networks:
      edge:
        ipv4_address: 172.30.0.11
  presentation-lb-backup:
    image: haproxy:3.2-alpine
    volumes:
    - ./haproxy/presentation-backup.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      web1:
        condition: service_started
      web2:
        condition: service_started
      web3:
        condition: service_started
    networks:
      edge:
        ipv4_address: 172.30.0.12
  presentation-entry:
    image: haproxy:3.2-alpine
    ports:
    - 80:80
    volumes:
    - ./haproxy/presentation-entry.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
    - presentation-lb-master
    - presentation-lb-backup
    networks:
    - edge
  presentation-keepalived-master:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: presentation-master.conf
    network_mode: service:presentation-lb-master
    cap_add:
    - NET_ADMIN
    - NET_BROADCAST
    - NET_RAW
    restart: unless-stopped
    depends_on:
      presentation-lb-master:
        condition: service_started
  presentation-keepalived-backup:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: presentation-backup.conf
    network_mode: service:presentation-lb-backup
    cap_add:
    - NET_ADMIN
    - NET_BROADCAST
    - NET_RAW
    restart: unless-stopped
    depends_on:
      presentation-lb-backup:
        condition: service_started
  web1:
    image: nginx:alpine
    hostname: webnode1
    volumes:
    - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./web/site1:/usr/share/nginx/html:ro
    - ./web/catalog.js:/usr/share/nginx/catalog.js:ro
    - ./web/catalog.css:/usr/share/nginx/catalog.css:ro
    depends_on:
    - application-lb-master
    networks:
    - edge
    - application
    restart: unless-stopped
  web2:
    image: nginx:alpine
    hostname: webnode2
    volumes:
    - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./web/site2:/usr/share/nginx/html:ro
    - ./web/catalog.js:/usr/share/nginx/catalog.js:ro
    - ./web/catalog.css:/usr/share/nginx/catalog.css:ro
    depends_on:
    - application-lb-master
    networks:
    - edge
    - application
    restart: unless-stopped
  web3:
    image: nginx:alpine
    hostname: webnode3
    volumes:
    - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./web/site3:/usr/share/nginx/html:ro
    - ./web/catalog.js:/usr/share/nginx/catalog.js:ro
    - ./web/catalog.css:/usr/share/nginx/catalog.css:ro
    depends_on:
    - application-lb-master
    networks:
    - edge
    - application
    restart: unless-stopped
  application-lb-master:
    image: haproxy:3.2-alpine
    volumes:
    - ./haproxy/application-master.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    networks:
      application:
        ipv4_address: 172.31.0.11
  application-lb-backup:
    image: haproxy:3.2-alpine
    volumes:
    - ./haproxy/application-backup.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    networks:
      application:
        ipv4_address: 172.31.0.12
  application-keepalived-master:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: application-master.conf
    network_mode: service:application-lb-master
    cap_add:
    - NET_ADMIN
    - NET_BROADCAST
    - NET_RAW
    restart: unless-stopped
    depends_on:
      application-lb-master:
        condition: service_started
  application-keepalived-backup:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: application-backup.conf
    network_mode: service:application-lb-backup
    cap_add:
    - NET_ADMIN
    - NET_BROADCAST
    - NET_RAW
    restart: unless-stopped
    depends_on:
      application-lb-backup:
        condition: service_started
  app1:
    build: ./application
    environment:
      DB_HOST: db-proxy1
      DB_PORT: 3306
      DB_NAME: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in .env}
      DB_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in .env}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      MONGO_DB: ${MONGO_DB_NAME:?Set MONGO_DB_NAME in .env}
      MONGO_USER: ${MONGO_APP_USERNAME}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD}
      APPLICATION_NODE: app1
      DB_HOSTS: db-proxy1,db-proxy2
      DB_POOL_LIMIT: '5'
      MONGO_HOSTS: mongo1:27017,mongo2:27017,mongo3:27017
      MONGO_AUTH_SOURCE: ${MONGO_DB_NAME}
      REDIS_SENTINELS: sentinel1:26379,sentinel2:26379,sentinel3:26379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENABLE_LAB_TESTS: ${ENABLE_LAB_TESTS:-true}
    restart: unless-stopped
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    networks:
    - application
    - database
  app2:
    build: ./application
    environment:
      DB_HOST: db-proxy1
      DB_PORT: 3306
      DB_NAME: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in .env}
      DB_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in .env}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      MONGO_DB: ${MONGO_DB_NAME:?Set MONGO_DB_NAME in .env}
      MONGO_USER: ${MONGO_APP_USERNAME}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD}
      APPLICATION_NODE: app2
      DB_HOSTS: db-proxy1,db-proxy2
      DB_POOL_LIMIT: '5'
      MONGO_HOSTS: mongo1:27017,mongo2:27017,mongo3:27017
      MONGO_AUTH_SOURCE: ${MONGO_DB_NAME}
      REDIS_SENTINELS: sentinel1:26379,sentinel2:26379,sentinel3:26379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENABLE_LAB_TESTS: ${ENABLE_LAB_TESTS:-true}
    restart: unless-stopped
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    networks:
    - application
    - database
  app3:
    build: ./application
    environment:
      DB_HOST: db-proxy1
      DB_PORT: 3306
      DB_NAME: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in .env}
      DB_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in .env}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      MONGO_DB: ${MONGO_DB_NAME:?Set MONGO_DB_NAME in .env}
      MONGO_USER: ${MONGO_APP_USERNAME}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD}
      APPLICATION_NODE: app3
      DB_HOSTS: db-proxy1,db-proxy2
      DB_POOL_LIMIT: '5'
      MONGO_HOSTS: mongo1:27017,mongo2:27017,mongo3:27017
      MONGO_AUTH_SOURCE: ${MONGO_DB_NAME}
      REDIS_SENTINELS: sentinel1:26379,sentinel2:26379,sentinel3:26379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENABLE_LAB_TESTS: ${ENABLE_LAB_TESTS:-true}
    restart: unless-stopped
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    networks:
    - application
    - database
  catalog-init:
    build: ./application
    command:
    - node
    - init-db.js
    environment:
      DB_HOST: db-proxy1
      DB_PORT: 3306
      DB_NAME: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in .env}
      DB_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in .env}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      MONGO_DB: ${MONGO_DB_NAME:?Set MONGO_DB_NAME in .env}
      MONGO_USER: ${MONGO_APP_USERNAME}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD}
      APPLICATION_NODE: app1
      DB_HOSTS: db-proxy1,db-proxy2
      DB_POOL_LIMIT: '5'
      MONGO_HOSTS: mongo1:27017,mongo2:27017,mongo3:27017
      MONGO_AUTH_SOURCE: ${MONGO_DB_NAME}
      REDIS_SENTINELS: sentinel1:26379,sentinel2:26379,sentinel3:26379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENABLE_LAB_TESTS: ${ENABLE_LAB_TESTS:-true}
    volumes:
    - ./database/catalog.sql:/app/database/catalog.sql:ro
    restart: 'no'
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      db-proxy1:
        condition: service_started
      db-proxy2:
        condition: service_started
    networks:
    - database
  galera1:
    image: bitnamilegacy/mariadb-galera:11.4.7-debian-12-r3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in
        .env}
      MARIADB_DATABASE: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in .env}
      MARIADB_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in .env}
      MARIADB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      MARIADB_GALERA_CLUSTER_NAME: distributed-cluster
      MARIADB_GALERA_CLUSTER_ADDRESS: gcomm://galera1,galera2,galera3
      MARIADB_GALERA_CLUSTER_BOOTSTRAP: ${GALERA_BOOTSTRAP:-no}
      MARIADB_GALERA_MARIABACKUP_USER: mariabackup
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_BACKUP_PASSWORD:?Set MARIADB_BACKUP_PASSWORD
        in .env}
      MARIADB_EXTRA_FLAGS: --max-connections=200
    volumes:
    - galera1-data:/bitnami/mariadb
    - ./ha/galera-health.sh:/opt/lab/galera-health.sh:ro
    healthcheck:
      test:
      - CMD
      - bash
      - /opt/lab/galera-health.sh
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
    - database
    restart: unless-stopped
  galera2:
    image: bitnamilegacy/mariadb-galera:11.4.7-debian-12-r3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in
        .env}
      MARIADB_GALERA_CLUSTER_NAME: distributed-cluster
      MARIADB_GALERA_CLUSTER_ADDRESS: gcomm://galera1,galera2,galera3
      MARIADB_GALERA_CLUSTER_BOOTSTRAP: 'no'
      MARIADB_GALERA_MARIABACKUP_USER: mariabackup
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_BACKUP_PASSWORD:?Set MARIADB_BACKUP_PASSWORD
        in .env}
      MARIADB_EXTRA_FLAGS: --max-connections=200
    volumes:
    - galera2-data:/bitnami/mariadb
    - ./ha/galera-health.sh:/opt/lab/galera-health.sh:ro
    depends_on:
      galera1:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - bash
      - /opt/lab/galera-health.sh
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
    - database
    restart: unless-stopped
  galera3:
    image: bitnamilegacy/mariadb-galera:11.4.7-debian-12-r3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in
        .env}
      MARIADB_GALERA_CLUSTER_NAME: distributed-cluster
      MARIADB_GALERA_CLUSTER_ADDRESS: gcomm://galera1,galera2,galera3
      MARIADB_GALERA_CLUSTER_BOOTSTRAP: 'no'
      MARIADB_GALERA_MARIABACKUP_USER: mariabackup
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_BACKUP_PASSWORD:?Set MARIADB_BACKUP_PASSWORD
        in .env}
      MARIADB_EXTRA_FLAGS: --max-connections=200
    volumes:
    - galera3-data:/bitnami/mariadb
    - ./ha/galera-health.sh:/opt/lab/galera-health.sh:ro
    depends_on:
      galera1:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - bash
      - /opt/lab/galera-health.sh
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
    - database
    restart: unless-stopped
  nagios:
    image: jasonrivers/nagios:latest
    ports:
    - 127.0.0.1:8088:80
    environment:
      NAGIOSADMIN_USER: nagiosadmin
      NAGIOSADMIN_PASS: ${NAGIOSADMIN_PASSWORD:?Set NAGIOSADMIN_PASSWORD in .env}
    volumes:
    - ./nagios/architecture.cfg:/opt/nagios/etc/objects/localhost.cfg:ro
    depends_on:
    - presentation-lb-master
    - presentation-lb-backup
    - presentation-keepalived-master
    - presentation-keepalived-backup
    - web1
    - web2
    - web3
    - application-lb-master
    - application-lb-backup
    - application-keepalived-master
    - application-keepalived-backup
    - app1
    - app2
    - app3
    - catalog-init
    - galera1
    - galera2
    - galera3
    - mongo1
    - mongo2
    - mongo3
    - redis1
    - redis2
    - redis3
    - sentinel1
    - sentinel2
    - sentinel3
    - db-proxy1
    - db-proxy2
    networks:
    - edge
    - application
    - database
  mongo1:
    image: mongo:8.0
    entrypoint:
    - bash
    - /opt/lab/mongo-entrypoint.sh
    command:
    - mongod
    - --replSet
    - rs0
    - --bind_ip_all
    - --keyFile
    - /tmp/replica.key
    - --wiredTigerCacheSizeGB
    - '0.25'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?run setup}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run setup}
    volumes:
    - mongo1-data:/data/db
    - ./secrets/mongo-keyfile:/run/secrets/mongo-keyfile:ro
    - ./ha/mongo-entrypoint.sh:/opt/lab/mongo-entrypoint.sh:ro
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
    - database
  mongo2:
    image: mongo:8.0
    entrypoint:
    - bash
    - /opt/lab/mongo-entrypoint.sh
    command:
    - mongod
    - --replSet
    - rs0
    - --bind_ip_all
    - --keyFile
    - /tmp/replica.key
    - --wiredTigerCacheSizeGB
    - '0.25'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?run setup}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run setup}
    volumes:
    - mongo2-data:/data/db
    - ./secrets/mongo-keyfile:/run/secrets/mongo-keyfile:ro
    - ./ha/mongo-entrypoint.sh:/opt/lab/mongo-entrypoint.sh:ro
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
    - database
  mongo3:
    image: mongo:8.0
    entrypoint:
    - bash
    - /opt/lab/mongo-entrypoint.sh
    command:
    - mongod
    - --replSet
    - rs0
    - --bind_ip_all
    - --keyFile
    - /tmp/replica.key
    - --wiredTigerCacheSizeGB
    - '0.25'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?run setup}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run setup}
    volumes:
    - mongo3-data:/data/db
    - ./secrets/mongo-keyfile:/run/secrets/mongo-keyfile:ro
    - ./ha/mongo-entrypoint.sh:/opt/lab/mongo-entrypoint.sh:ro
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
    - database
  mongo-init:
    image: mongo:8.0
    entrypoint:
    - bash
    - -ec
    - mongosh --host mongo1 --username "$MONGO_ROOT_USERNAME" --password "$MONGO_ROOT_PASSWORD"
      --authenticationDatabase admin --file /init.js
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
    - ./ha/mongo-init.js:/init.js:ro
    restart: on-failure:5
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    networks:
    - database
  redis1:
    image: redis:7.4-alpine
    entrypoint:
    - sh
    - /opt/lab/redis-start.sh
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run setup}
      NODE_IP: 172.28.0.21
      INITIAL_REPLICA: '0'
    volumes:
    - redis1-config:/data
    - ./ha/redis-start.sh:/opt/lab/redis-start.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      database:
        ipv4_address: 172.28.0.21
  sentinel1:
    image: redis:7.4-alpine
    entrypoint:
    - sh
    - /opt/lab/sentinel-start.sh
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NODE_IP: 172.28.0.31
    volumes:
    - sentinel1-config:/data
    - ./ha/sentinel-start.sh:/opt/lab/sentinel-start.sh:ro
    depends_on:
      redis1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      database:
        ipv4_address: 172.28.0.31
  redis2:
    image: redis:7.4-alpine
    entrypoint:
    - sh
    - /opt/lab/redis-start.sh
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run setup}
      NODE_IP: 172.28.0.22
      INITIAL_REPLICA: '1'
    volumes:
    - redis2-config:/data
    - ./ha/redis-start.sh:/opt/lab/redis-start.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      database:
        ipv4_address: 172.28.0.22
  sentinel2:
    image: redis:7.4-alpine
    entrypoint:
    - sh
    - /opt/lab/sentinel-start.sh
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NODE_IP: 172.28.0.32
    volumes:
    - sentinel2-config:/data
    - ./ha/sentinel-start.sh:/opt/lab/sentinel-start.sh:ro
    depends_on:
      redis1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      database:
        ipv4_address: 172.28.0.32
  redis3:
    image: redis:7.4-alpine
    entrypoint:
    - sh
    - /opt/lab/redis-start.sh
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run setup}
      NODE_IP: 172.28.0.23
      INITIAL_REPLICA: '1'
    volumes:
    - redis3-config:/data
    - ./ha/redis-start.sh:/opt/lab/redis-start.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      database:
        ipv4_address: 172.28.0.23
  sentinel3:
    image: redis:7.4-alpine
    entrypoint:
    - sh
    - /opt/lab/sentinel-start.sh
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NODE_IP: 172.28.0.33
    volumes:
    - sentinel3-config:/data
    - ./ha/sentinel-start.sh:/opt/lab/sentinel-start.sh:ro
    depends_on:
      redis1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      database:
        ipv4_address: 172.28.0.33
  galera-check1:
    build: ./ha/galera-check
    network_mode: service:galera1
    environment:
      DB_USER: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    depends_on:
      galera1:
        condition: service_healthy
    restart: unless-stopped
  galera-check2:
    build: ./ha/galera-check
    network_mode: service:galera2
    environment:
      DB_USER: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    depends_on:
      galera2:
        condition: service_healthy
    restart: unless-stopped
  galera-check3:
    build: ./ha/galera-check
    network_mode: service:galera3
    environment:
      DB_USER: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    depends_on:
      galera3:
        condition: service_healthy
    restart: unless-stopped
  db-proxy1:
    image: haproxy:3.2-alpine
    volumes:
    - ./ha/galera-haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
