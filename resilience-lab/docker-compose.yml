name: resilience-lab
x-tool:
  restart: unless-stopped
  command: &id001
  - sleep
  - infinity
  volumes: &id002
  - results:/results
services:
  ab:
    restart: unless-stopped
    command: *id001
    volumes: *id002
    build: ./ab
    container_name: lab-ab
    networks:
    - edge
  siege:
    restart: unless-stopped
    command: *id001
    volumes: *id002
    build: ./siege
    container_name: lab-siege
    networks:
    - edge
  jmeter:
    restart: unless-stopped
    command: *id001
    volumes: *id002
    build: ./jmeter
    container_name: lab-jmeter
    networks:
    - edge
  chaosmonkey:
    restart: unless-stopped
    command: *id001
    volumes:
    - results:/results
    - /var/run/docker.sock:/var/run/docker.sock
    build: ./chaosmonkey
    container_name: lab-chaosmonkey
    environment:
      CHAOS_PROJECT: ${TARGET_PROJECT:-distributed-ha-lab}
    networks:
    - edge
  dashboard:
    build: ./dashboard
    container_name: lab-dashboard
    restart: unless-stopped
    ports:
    - 127.0.0.1:${DASHBOARD_PORT:-8090}:8090
    environment:
      DEFAULT_TARGET: ${DEFAULT_TARGET:-http://presentation-entry}
    volumes:
    - results:/results
    - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
    - ab
    - siege
    - jmeter
    - chaosmonkey
    networks:
    - edge
volumes:
  results: null
networks:
  edge:
    name: ${TARGET_PROJECT:-distributed-ha-lab}_edge
    external: true
