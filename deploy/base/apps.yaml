        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: '1'
            memory: 384Mi
        envFrom:
        - configMapRef:
            name: catalog-env
        - secretRef:
            name: catalog-auth
        env:
        - name: APPLICATION_NODE
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: AMQP_URL
          valueFrom:
            secretKeyRef:
