---
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-seed-v1
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  template:
    metadata:
      labels:
        app: seed
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: seed
        image: catalog-api
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: '1'
            memory: 384Mi
        envFrom:
        - configMapRef:
            name: catalog-env
        - secretRef:
            name: catalog-auth
        env:
        - name: APPLICATION_NODE
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: AMQP_URL
          valueFrom:
            secretKeyRef:
              name: broker-default-user
              key: connection_string
        command:
        - node
        - init-db.js
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: OnFailure
  backoffLimit: 8
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-env
data:
  MONGO_DB: catalog
  MONGO_AUTH_SOURCE: admin
  MONGO_USER: catalog
  MONGO_REPLICA_SET: reviews
  MONGO_HOSTS: reviews-0.reviews-svc:27017,reviews-1.reviews-svc:27017,reviews-2.reviews-svc:27017
  DB_HOST: sql-proxy
  DB_PORT: '3306'
  DB_NAME: catalog
  DB_USER: catalog
  REDIS_MASTER_NAME: cachemaster
  REDIS_SENTINELS: cache-node-0.cache-headless:26379,cache-node-1.cache-headless:26379,cache-node-2.cache-headless:26379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: web
    ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: catalog-throttle@kubernetescrd
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - secretName: catalog-tls
    hosts:
    - catalog.lab.test
  rules:
  - host: catalog.lab.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 8080
