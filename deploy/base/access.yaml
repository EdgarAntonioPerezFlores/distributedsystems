apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: throttle
  namespace: catalog
spec:
  rateLimit:
    average: 1000
    burst: 2000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: writer-auth
  namespace: catalog
spec:
  basicAuth:
    secret: catalog-writers
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalog-writes
  namespace: catalog
spec:
  entryPoints:
  - websecure
  tls:
    secretName: catalog-tls
  routes:
  - kind: Rule
    match: Host(`catalog.lab.test`) && PathPrefix(`/api/`) && Method(`POST`)
    priority: 10000
    middlewares:
    - name: throttle
    - name: writer-auth
    services:
    - name: web
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-isolation
  namespace: catalog
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: TCP
    - port: 53
      protocol: UDP
  - to:
    - podSelector:
        matchLabels:
          app: api
    ports:
    - port: 8080
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app: otel
    ports:
    - port: 4317
    - port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-isolation
  namespace: catalog
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: TCP
    - port: 53
      protocol: UDP
  - to:
    - podSelector: {}
    ports:
    - port: 3306
    - port: 27017
    - port: 6379
    - port: 26379
    - port: 5672
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app: otel
    ports:
    - port: 4318
---
