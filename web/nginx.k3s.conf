server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Web-Node $hostname always;

    location = /catalog.js {
        alias /usr/share/nginx/catalog.js;
    }

    location = /catalog.css {
        alias /usr/share/nginx/catalog.css;
    }

    location = /telemetry/v1/traces {
        limit_except POST { deny all; }
        client_max_body_size 256k;
        resolver kube-dns.kube-system.svc.cluster.local valid=30s;
        set $gateway otel.observability.svc.cluster.local;
        proxy_pass http://$gateway:4318/v1/traces;
    }

    location /api/ {
        otel_trace $otel_parent_sampled;
        otel_trace_context propagate;
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Presentation-LB $http_x_presentation_lb;
        proxy_set_header X-Web-Node $hostname;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
