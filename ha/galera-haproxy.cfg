global
    log stdout format raw local0
    maxconn 300
defaults
    log global
    mode tcp
    option tcplog
    timeout connect 2s
    timeout client 35s
    timeout server 35s
    timeout check 2s
    timeout queue 5s
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
frontend mysql
    bind *:3306
    default_backend galera_writer
backend galera_writer
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server galera1 galera1:3306 check port 9200 maxconn 80
    server galera2 galera2:3306 check port 9200 maxconn 80 backup
    server galera3 galera3:3306 check port 9200 maxconn 80 backup
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
